<!doctype html>
<!-- `lang` starts at the source locale and is updated by setLang() in
     src/lib/stores/app.ts — there is no server render to substitute it in. -->
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Inter is self-hosted (see scripts/vendor-fonts.mjs): no third-party request,
		     works in filtered school networks, and no visitor IPs leak to Google.
		     Declared here rather than in a <svelte:head> because this app renders
		     client-side (ssr = false), so anything in a component's head only appears
		     after the JS bundle has booted — the font would start downloading far too
		     late. Here it loads in parallel with the bundle. -->
		<link rel="preload" href="%sveltekit.assets%/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin="anonymous" />
		<link rel="stylesheet" href="%sveltekit.assets%/fonts/inter.css" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
